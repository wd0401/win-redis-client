<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200" role="img" aria-labelledby="title desc">
  <title id="title">WinRedis Logo</title>
  <desc id="desc">A modern purple Redis desktop tool logo with a stylized lightning bolt and connected data nodes, followed by the WinRedis wordmark.</desc>
  <defs>
    <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#756BFF"/>
      <stop offset="100%" stop-color="#5548E8"/>
    </linearGradient>
  </defs>

  <!-- App icon -->
  <g transform="translate(24 24)">
    <rect x="0" y="0" width="152" height="152" rx="34" fill="url(#brandGradient)"/>
    <!-- Redis/data stack -->
    <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.96">
      <path d="M35 48 L58 36 L81 48 L58 60 Z"/>
      <path d="M35 64 L58 76 L81 64"/>
      <path d="M35 80 L58 92 L81 80"/>
      <path d="M35 96 L58 108 L81 96"/>
      <path d="M35 112 L58 124 L81 112"/>
    </g>
    <!-- Lightning bolt -->
    <path d="M94 35 L72 79 L91 79 L78 119 L116 68 L96 68 L110 35 Z"
          fill="#FFFFFF" stroke="#FFFFFF" stroke-linejoin="round" stroke-width="2"/>
    <!-- Small connection nodes -->
    <circle cx="119" cy="116" r="5" fill="#C9C5FF"/>
    <circle cx="132" cy="103" r="4" fill="#C9C5FF"/>
    <path d="M119 116 L132 103" stroke="#C9C5FF" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="202" y="104" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="54" font-weight="750" letter-spacing="-1.8" fill="#172033">Win<tspan fill="#625BFF">Redis</tspan></text>
  <text x="205" y="137" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="2.6" fill="#64748B">REDIS DESKTOP CLIENT</text>
</svg>
